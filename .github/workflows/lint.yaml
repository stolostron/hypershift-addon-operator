name: Lint

on:
  pull_request:
    branches: ["main", "backplane-*"]
  push:
    branches: ["main", "backplane-*"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Determine lint base revision
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "rev=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "rev=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run make lint
        run: make lint LINT_NEW_FROM_REV=${{ steps.base.outputs.rev }}
